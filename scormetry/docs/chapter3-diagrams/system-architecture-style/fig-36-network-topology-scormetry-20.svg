    </g>
    <path d="M680,665 H720" class="line"/>

    <rect x="1080" y="605" width="145" height="72" class="service"/>
    <text x="1152" y="637" text-anchor="middle" class="label"><tspan x="1152" dy="0">Google OAuth /</tspan><tspan x="1152" dy="18">SMTP / OpenAI</tspan></text>
