  <rect x="245" y="1810" width="130" height="62" class="blue"/>
  <text x="310" y="1835" text-anchor="middle" class="small">Private File</text>
  <text x="310" y="1855" text-anchor="middle" class="small">Storage</text>
  <path d="M640,1695 H370" class="line"/>
  <path d="M640,1732 C535,1800 450,1835 375,1840" class="line"/>

  <rect x="535" y="1575" width="115" height="48" class="box"/>
