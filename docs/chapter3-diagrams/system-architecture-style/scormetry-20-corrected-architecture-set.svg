  <rect x="675" y="1575" width="115" height="48" class="box"/>
  <text x="732" y="1605" text-anchor="middle" class="tiny">Role</text>
  <rect x="815" y="1575" width="125" height="48" class="box"/>
  <text x="878" y="1605" text-anchor="middle" class="tiny">Session Token</text>
  <path d="M592,1623 V1668" class="lineNoArrow"/>
  <path d="M732,1623 V1668" class="lineNoArrow"/>
  <path d="M878,1623 C878,1660 838,1685 800,1698" class="line"/>

