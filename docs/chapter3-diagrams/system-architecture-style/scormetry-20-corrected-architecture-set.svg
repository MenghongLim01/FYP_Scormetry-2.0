  <rect x="723" y="415" width="115" height="48" class="green" rx="8"/>
  <text x="780" y="444" text-anchor="middle" class="small">Student Panel</text>

  <rect x="940" y="327" width="150" height="64" class="blue" rx="12"/>
  <text x="1015" y="353" text-anchor="middle" class="small">Laravel Backend</text>
  <text x="1015" y="374" text-anchor="middle" class="tiny">routes + policies + storage</text>
  <path d="M865,360 H940" class="line"/>

  <rect x="935" y="230" width="160" height="62" class="blue"/>
  <text x="1015" y="255" text-anchor="middle" class="small">Private File</text>
  <text x="1015" y="275" text-anchor="middle" class="small">Storage</text>
  <path d="M1015,327 V292" class="line"/>

  <use href="#database" x="1248" y="358"/>
  <text x="1248" y="454" text-anchor="middle" class="label">MySQL Database</text>
  <path d="M1090,360 H1190" class="line"/>

  <rect x="715" y="575" width="135" height="115" class="dashbox"/>
  <use href="#google" x="783" y="625"/>
  <text x="783" y="678" text-anchor="middle" class="small">Google OAuth</text>
  <path d="M783,575 V455" class="dashline"/>

  <rect x="940" y="575" width="135" height="115" class="dashbox"/>
  <use href="#mail" x="1008" y="625"/>
  <text x="1008" y="678" text-anchor="middle" class="small">Mail / SMTP</text>
