  <rect x="1280" y="1075" width="102" height="62" class="blue"/>
  <text x="1331" y="1100" text-anchor="middle" class="small">Private File</text>
  <text x="1331" y="1120" text-anchor="middle" class="small">Storage</text>

  <path d="M205,985 H318" class="dashline"/>
  <path d="M318,1015 H205" class="dashline"/>
  <path d="M430,985 H552" class="dashline"/>
  <path d="M552,1015 H430" class="dashline"/>
  <path d="M666,985 H787" class="dashline"/>
  <path d="M787,1015 H666" class="dashline"/>
  <path d="M903,985 H1036" class="dashline"/>
  <path d="M1036,1015 H903" class="dashline"/>
  <path d="M1138,958 H1268" class="dashline"/>
  <path d="M1138,1020 C1190,1080 1232,1100 1280,1105" class="dashline"/>

  <text x="800" y="1190" text-anchor="middle" class="caption">Fig. 36. Network Topology for Scormetry 2.0</text>

  <!-- Diagram 3: Security -->
  <text x="60" y="1315" class="title">Security</text>
  <rect x="50" y="1345" width="1500" height="630" class="panel"/>

  <rect x="95" y="1425" width="88" height="72" fill="#32c4e5" stroke="#111" stroke-width="2"/>
  <rect x="110" y="1438" width="58" height="12" fill="#fff"/>
  <text x="139" y="1528" text-anchor="middle" class="label">Browser</text>
  <path d="M185,1460 H310" class="line"/>

  <use href="#cloudflare" x="370" y="1427"/>
  <text x="370" y="1492" text-anchor="middle" class="small">Cloudflare Firewall</text>
  <rect x="520" y="1430" width="125" height="48" class="box"/>
  <text x="582" y="1452" text-anchor="middle" class="tiny">DDoS</text>
  <text x="582" y="1468" text-anchor="middle" class="tiny">Protection</text>
  <rect x="700" y="1430" width="145" height="48" class="box"/>
  <text x="772" y="1452" text-anchor="middle" class="tiny">Automatic</text>
  <text x="772" y="1468" text-anchor="middle" class="tiny">HTTPS Rewrite</text>
  <path d="M430,1460 H520" class="lineNoArrow"/>
  <path d="M645,1460 H700" class="lineNoArrow"/>
  <path d="M845,1460 H975" class="line"/>
