  <path d="M1334,1743 H1270" class="line"/>
  <path d="M1120,1743 H1080" class="line"/>

  <rect x="500" y="1810" width="125" height="50" class="box"/>
  <text x="562" y="1830" text-anchor="middle" class="tiny">Secure</text>
  <text x="562" y="1846" text-anchor="middle" class="tiny">Configuration</text>
