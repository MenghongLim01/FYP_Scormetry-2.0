  <rect x="900" y="1600" width="180" height="220" class="dashbox"/>
  <text x="990" y="1628" text-anchor="middle" class="label">FRONTEND</text>
  <rect x="930" y="1660" width="120" height="42" class="yellow" rx="7"/>
  <text x="990" y="1686" text-anchor="middle" class="tiny">Teacher Panel</text>
  <rect x="930" y="1715" width="120" height="42" class="yellow" rx="7"/>
