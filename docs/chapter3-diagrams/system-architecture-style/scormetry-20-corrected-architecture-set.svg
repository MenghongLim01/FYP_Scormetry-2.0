  <text x="1245" y="1890" text-anchor="middle" class="tiny">Private File</text>
  <text x="1245" y="1906" text-anchor="middle" class="tiny">Access Check</text>
  <path d="M990,1820 V1870" class="lineNoArrow"/>
  <path d="M990,1845 H1245 V1870" class="lineNoArrow"/>

  <text x="800" y="2035" text-anchor="middle" class="caption">Fig. 37. Security Architecture for Scormetry 2.0</text>
