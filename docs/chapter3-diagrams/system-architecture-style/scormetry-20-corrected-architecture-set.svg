<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2100" viewBox="0 0 1600 2100">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
    <marker id="arrowDash" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#333"/>
    </marker>
    <style>
      .title { font-family: "Times New Roman", serif; font-size: 38px; font-weight: 700; fill: #000; }
      .caption { font-family: "Times New Roman", serif; font-size: 34px; font-weight: 700; fill: #000; }
      .label { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #000; }
      .small { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #000; }
      .tiny { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #000; }
      .panel { fill: #fff; stroke: #111; stroke-width: 2; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .round { fill: #fff; stroke: #111; stroke-width: 2; rx: 28; ry: 28; }
      .dashbox { fill: #fff; stroke: #111; stroke-width: 2; stroke-dasharray: 7 5; }
      .line { stroke: #111; stroke-width: 2.4; fill: none; marker-end: url(#arrow); }
      .lineNoArrow { stroke: #111; stroke-width: 2.4; fill: none; }
      .dashline { stroke: #333; stroke-width: 2; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrowDash); }
      .orange { fill: #ff8b1a; stroke: #ff8b1a; }
      .blue { fill: #dfefff; stroke: #75a6d6; stroke-width: 2; }
      .green { fill: #dff4dc; stroke: #72ad65; stroke-width: 2; }
      .yellow { fill: #fff3b8; stroke: #e0a028; stroke-width: 2; }
      .gray { fill: #f6f6f6; stroke: #777; stroke-width: 2; }
      .db { fill: #dff3ff; stroke: #1f5fc5; stroke-width: 4; }
      .iconStroke { stroke: #111; stroke-width: 3; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="2100" fill="#fff"/>

  <!-- Shared icons -->
  <g id="laptop">
    <rect x="-31" y="-22" width="62" height="42" fill="#7ee3ff" stroke="#6b6b6b" stroke-width="2" rx="2"/>
    <rect x="-24" y="-16" width="48" height="28" fill="#9ee9ff" stroke="none"/>
    <path d="M-42,28 H42 L30,40 H-30 Z" fill="#aaa" stroke="#555" stroke-width="2"/>
  </g>
  <g id="cloudflare">
    <ellipse cx="0" cy="18" rx="52" ry="20" class="orange"/>
    <circle cx="-28" cy="14" r="20" class="orange"/>
    <circle cx="8" cy="7" r="26" class="orange"/>
    <circle cx="43" cy="19" r="17" class="orange"/>
  </g>
  <g id="database">
    <ellipse cx="0" cy="-32" rx="48" ry="16" class="db"/>
    <rect x="-48" y="-32" width="96" height="78" class="db"/>
    <ellipse cx="0" cy="46" rx="48" ry="16" class="db"/>
    <ellipse cx="0" cy="-32" rx="48" ry="16" fill="none" stroke="#1f5fc5" stroke-width="4"/>
  </g>
  <g id="mail">
    <rect x="-45" y="-28" width="90" height="58" fill="#fff" stroke="#111" stroke-width="2" rx="5"/>
    <path d="M-39,-20 L0,10 L39,-20" fill="none" stroke="#d33" stroke-width="7"/>
  </g>
  <g id="google">
    <circle cx="0" cy="0" r="36" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="0" y="14" text-anchor="middle" font-family="Arial, sans-serif" font-size="48" font-weight="700" fill="#000">G</text>
  </g>
  <g id="openai">
    <circle cx="0" cy="0" r="36" fill="#fff" stroke="#111" stroke-width="2"/>
    <text x="0" y="11" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#000">AI</text>
  </g>
  <g id="firewall">
    <rect x="-55" y="-36" width="110" height="72" fill="#df4b33" stroke="#111" stroke-width="2"/>
    <path d="M-55,-12 H55 M-55,12 H55 M-18,-36 V-12 M18,-36 V-12 M0,-12 V12 M-28,12 V36 M28,12 V36" stroke="#8b1e13" stroke-width="3"/>
    <circle cx="36" cy="32" r="19" fill="#cdeeca" stroke="#111" stroke-width="2"/>
    <path d="M26,31 L34,39 L48,24" fill="none" stroke="#0b7f2a" stroke-width="4"/>
  </g>
  <g id="serverIcon">
    <rect x="-35" y="-45" width="70" height="90" fill="#e6eef8" stroke="#111" stroke-width="2" rx="6"/>
    <rect x="-24" y="-32" width="48" height="16" fill="#222"/>
    <rect x="-24" y="-8" width="48" height="16" fill="#222"/>
    <rect x="-24" y="16" width="48" height="16" fill="#222"/>
  </g>
  <g id="router">
    <ellipse cx="0" cy="0" rx="58" ry="28" fill="#6eb7ff" stroke="#111" stroke-width="2"/>
    <path d="M-30,0 H30 M0,-15 V15 M-20,-10 L-30,0 L-20,10 M20,-10 L30,0 L20,10" stroke="#fff" stroke-width="4" fill="none"/>
  </g>

  <!-- Diagram 1: Network Model -->
  <text x="60" y="60" class="title">Network Model</text>
  <rect x="50" y="90" width="1500" height="640" class="panel"/>

  <use href="#laptop" x="125" y="190"/>
  <text x="125" y="265" text-anchor="middle" class="label">Teacher / Admin</text>
  <use href="#laptop" x="125" y="325"/>
  <text x="125" y="400" text-anchor="middle" class="label">Judge / Reviewer</text>
  <use href="#laptop" x="125" y="460"/>
  <text x="125" y="535" text-anchor="middle" class="label">Student</text>
  <path d="M180,195 H260 V465 H180" class="lineNoArrow"/>
  <path d="M260,330 H405" class="line"/>

  <use href="#cloudflare" x="470" y="295"/>
  <text x="470" y="358" text-anchor="middle" class="label">CLOUDFLARE</text>
  <text x="470" y="382" text-anchor="middle" class="small">DNS / HTTPS</text>
  <text x="470" y="405" text-anchor="middle" class="tiny">scormetry.paragoniu.app</text>
  <path d="M530,330 H660" class="line"/>

  <rect x="660" y="130" width="790" height="420" class="round"/>
  <text x="1055" y="168" text-anchor="middle" class="label">SCORMETRY 2.0 SERVER</text>
  <text x="1055" y="192" text-anchor="middle" class="small">Laravel / Inertia / Vue Environment</text>

  <rect x="695" y="230" width="170" height="225" class="dashbox"/>
  <text x="780" y="258" text-anchor="middle" class="label">FRONTEND</text>
  <rect x="723" y="285" width="115" height="48" class="yellow" rx="8"/>
  <text x="780" y="314" text-anchor="middle" class="small">Teacher Panel</text>
  <rect x="723" y="350" width="115" height="48" class="yellow" rx="8"/>
