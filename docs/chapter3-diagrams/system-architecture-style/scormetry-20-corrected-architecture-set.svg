  <rect x="1165" y="575" width="180" height="115" class="dashbox"/>
  <use href="#openai" x="1255" y="622"/>
  <text x="1255" y="672" text-anchor="middle" class="small">OpenAI Responses API</text>
  <text x="1255" y="692" text-anchor="middle" class="tiny">gpt-5.4-nano</text>
  <path d="M1090,385 C1135,455 1200,520 1255,575" class="dashline"/>

  <text x="800" y="720" text-anchor="middle" class="caption">Fig. 35. Network Model for Scormetry 2.0</text>

  <!-- Diagram 2: Network Topology -->
  <text x="60" y="745" class="title">Network Topology</text>
  <rect x="50" y="775" width="1500" height="445" class="panel"/>

  <circle cx="160" cy="990" r="38" fill="#fff" stroke="#111" stroke-width="4"/>
  <path d="M120,1060 C125,1018 195,1018 200,1060" class="iconStroke"/>
  <text x="160" y="1095" text-anchor="middle" class="label">End User</text>

  <use href="#cloudflare" x="375" y="960"/>
