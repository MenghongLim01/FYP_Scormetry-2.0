<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="980" viewBox="0 0 1320 980">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#111"/>
    </marker>
    <marker id="arrow-gray" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 Z" fill="#444"/>
    </marker>
  </defs>
  <style>
    .title { font-family: "Times New Roman", serif; font-size: 38px; font-weight: 700; fill:#000; }
    .caption { font-family: "Times New Roman", serif; font-size: 36px; font-weight: 700; fill:#000; }
    .label { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 16px; font-weight: 700; fill:#000; }
    .small { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 13px; font-weight: 700; fill:#000; }
    .tiny { font-family: "Comic Sans MS", "Chalkboard SE", Arial, sans-serif; font-size: 11px; font-weight: 700; fill:#000; }
    .line { stroke:#111; stroke-width:2; fill:none; marker-end:url(#arrow); }
    .line2 { stroke:#444; stroke-width:2; fill:none; marker-end:url(#arrow-gray); stroke-dasharray:5 5; }
    .box { fill:#fff; stroke:#111; stroke-width:2; }
    .round { fill:#fff; stroke:#111; stroke-width:2; rx:28; ry:28; }
    .service { fill:#fff; stroke:#111; stroke-width:2; stroke-dasharray:6 4; }
    .panel-yellow { fill:#fff3bd; stroke:#e0a028; stroke-width:1.5; rx:8; ry:8; }
    .panel-green { fill:#dff2d8; stroke:#77ad62; stroke-width:1.5; rx:8; ry:8; }
    .panel-blue { fill:#dfefff; stroke:#8baed0; stroke-width:1.5; rx:8; ry:8; }
    .db { fill:#def3ff; stroke:#111; stroke-width:2; }
    .cloud { fill:#ff8b1a; stroke:#ff8b1a; stroke-width:2; }
  </style>

  <rect width="1320" height="980" fill="#fff"/>
  <text x="22" y="52" class="title">Deployment Diagram</text>
  <rect x="30" y="108" width="1260" height="740" fill="#fff" stroke="#111" stroke-width="1.6"/>

  <g>
    <rect x="70" y="155" width="335" height="280" class="round"/>
    <text x="238" y="190" text-anchor="middle" class="label">DEVELOPMENT ENVIRONMENT</text>
    <text x="238" y="212" text-anchor="middle" class="small">Localhost / Capstone Development</text>

    <rect x="120" y="242" width="75" height="48" class="box" rx="2"/>
    <rect x="131" y="251" width="53" height="31" fill="#fff" stroke="#777" stroke-width="1"/>
    <path d="M110,300 L205,300 L190,312 L125,312 Z" fill="#555"/>
    <text x="158" y="335" text-anchor="middle" class="label"><tspan x="158" dy="0">Developer</tspan><tspan x="158" dy="18">Laptop</tspan></text>

    <rect x="240" y="235" width="128" height="52" class="panel-yellow"/>
    <text x="304" y="257" text-anchor="middle" class="small"><tspan x="304" dy="0">Laravel 13</tspan><tspan x="304" dy="16">Inertia 3 / Vue 3</tspan></text>
    <rect x="240" y="305" width="128" height="48" class="panel-blue"/>
    <text x="304" y="326" text-anchor="middle" class="small"><tspan x="304" dy="0">MySQL Local</tspan><tspan x="304" dy="16">Database</tspan></text>
    <rect x="240" y="370" width="128" height="42" class="panel-green"/>
    <text x="304" y="395" text-anchor="middle" class="small">Local File Storage</text>
  </g>

  <g>
    <rect x="480" y="155" width="335" height="280" class="round"/>
    <text x="648" y="190" text-anchor="middle" class="label">TESTING / UAT ENVIRONMENT</text>
    <text x="648" y="212" text-anchor="middle" class="small">Midterm and User Acceptance Testing</text>

    <rect x="540" y="240" width="215" height="55" class="panel-yellow"/>
    <text x="648" y="263" text-anchor="middle" class="small"><tspan x="648" dy="0">Staging Build</tspan><tspan x="648" dy="16">or Localhost Demo</tspan></text>
    <rect x="540" y="313" width="215" height="55" class="panel-blue"/>
    <text x="648" y="337" text-anchor="middle" class="small"><tspan x="648" dy="0">Seeded Test Data</tspan><tspan x="648" dy="16">Subjects, Teams, Rubrics</tspan></text>
    <rect x="540" y="386" width="215" height="36" class="panel-green"/>
    <text x="648" y="409" text-anchor="middle" class="small">Teacher / Judge / Student UAT</text>
  </g>

  <g>
    <rect x="890" y="155" width="335" height="280" class="round"/>
    <text x="1058" y="190" text-anchor="middle" class="label">PRODUCTION ENVIRONMENT</text>
    <text x="1058" y="212" text-anchor="middle" class="small">DigitalOcean or ParagonIU Server</text>

    <rect x="925" y="238" width="120" height="52" class="panel-yellow"/>
    <text x="985" y="260" text-anchor="middle" class="small"><tspan x="985" dy="0">Nginx / HTTPS</tspan><tspan x="985" dy="16">Reverse Proxy</tspan></text>
    <rect x="925" y="318" width="120" height="62" fill="#dfefff" stroke="#79a6d2" stroke-width="2" rx="10"/>
    <text x="985" y="344" text-anchor="middle" class="small"><tspan x="985" dy="0">Scormetry 2.0</tspan><tspan x="985" dy="16">Laravel App</tspan></text>
    <path d="M985,290 V318" class="line"/>

    <g>
      <ellipse cx="1142" cy="252" rx="42" ry="14" class="db"/>
      <rect x="1100" y="252" width="84" height="54" class="db"/>
      <ellipse cx="1142" cy="306" rx="42" ry="14" class="db"/>
      <ellipse cx="1142" cy="252" rx="42" ry="14" fill="none" stroke="#111" stroke-width="2"/>
      <text x="1142" y="336" text-anchor="middle" class="small">MySQL Database</text>
    </g>
    <rect x="1090" y="356" width="112" height="46" class="panel-blue"/>
    <text x="1146" y="377" text-anchor="middle" class="small"><tspan x="1146" dy="0">Private File</tspan><tspan x="1146" dy="15">Storage</tspan></text>
    <path d="M1045,348 H1100" class="line"/>
    <path d="M1045,355 H1090" class="line"/>
  </g>

  <g>
    <rect x="430" y="230" width="70" height="70" class="service"/>
    <circle cx="465" cy="265" r="25" fill="#111"/>
    <text x="465" y="270" text-anchor="middle" fill="#fff" font-family="Arial, sans-serif" font-size="24" font-weight="700">GH</text>
    <text x="465" y="318" text-anchor="middle" class="small">GitHub Repo</text>
  </g>

  <path d="M405,290 H430" class="line"/>
  <path d="M500,290 H540" class="line"/>
  <path d="M755,290 H890" class="line"/>
  <text x="448" y="378" text-anchor="middle" class="tiny">push source code</text>
  <text x="836" y="278" text-anchor="middle" class="tiny">deploy approved build</text>

  <g>
    <rect x="90" y="570" width="75" height="48" class="box" rx="2"/>
    <rect x="101" y="579" width="53" height="31" fill="#fff" stroke="#777" stroke-width="1"/>
    <path d="M80,628 L175,628 L160,640 L95,640 Z" fill="#555"/>
    <text x="128" y="670" text-anchor="middle" class="label">End Users</text>
    <text x="128" y="692" text-anchor="middle" class="small">Teacher / Judge / Student</text>
  </g>

  <g transform="translate(245,578) scale(0.86)">
    <ellipse cx="48" cy="32" rx="36" ry="20" class="cloud"/>
    <circle cx="28" cy="29" r="18" class="cloud"/>
    <circle cx="62" cy="24" r="22" class="cloud"/>
    <circle cx="83" cy="35" r="14" class="cloud"/>
    <text x="56" y="76" text-anchor="middle" class="label">CLOUDFLARE</text>
    <text x="56" y="96" text-anchor="middle" class="small">DNS / SSL / Firewall</text>
  </g>

  <path d="M180,620 H250" class="line2"/>
  <path d="M350,620 H925 V264" class="line"/>
  <text x="675" y="608" text-anchor="middle" class="small">scormetry.paragoniu.app</text>

  <rect x="640" y="655" width="145" height="105" class="service"/>
  <circle cx="712" cy="693" r="28" fill="#fff" stroke="#111" stroke-width="2"/>
  <text x="712" y="704" text-anchor="middle" font-family="Arial, sans-serif" font-size="36" font-weight="700">G</text>
  <text x="712" y="740" text-anchor="middle" class="small">Google OAuth</text>
  <path d="M925,335 H785 V704" class="line2"/>

  <rect x="840" y="655" width="145" height="105" class="service"/>
  <rect x="875" y="674" width="74" height="48" fill="#fff" stroke="#111" stroke-width="2" rx="4"/>
  <path d="M879,681 L912,705 L945,681" fill="none" stroke="#d33" stroke-width="5"/>
  <text x="912" y="742" text-anchor="middle" class="small">Mail / SMTP</text>
  <path d="M985,380 V655" class="line2"/>

  <rect x="1040" y="655" width="150" height="105" class="service"/>
  <text x="1115" y="690" text-anchor="middle" class="label"><tspan x="1115" dy="0">OpenAI Responses</tspan><tspan x="1115" dy="18">API</tspan></text>
  <text x="1115" y="735" text-anchor="middle" class="small">gpt-5.4-nano</text>
  <path d="M1045,345 H1115 V655" class="line2"/>

  <rect x="75" y="760" width="395" height="58" class="panel-green"/>
  <text x="272" y="783" text-anchor="middle" class="small"><tspan x="272" dy="0">Implementation plan: localhost midterm demo → staging/UAT → production deployment.</tspan><tspan x="272" dy="17">Website target completion: first week of May.</tspan></text>

  <text x="660" y="925" text-anchor="middle" class="caption">Fig. 38. Deployment Diagram for Scormetry 2.0</text>
</svg>
